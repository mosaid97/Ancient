services:
  neo4j:
    image: neo4j:5.18-community
    container_name: ancient-neo4j
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      # The Neo4j Docker image requires the bootstrap admin to be `neo4j`.
      # Additional users (e.g. AncientChina) can be created via Cypher in a
      # later migration script.
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD}"
      # GDS is added in Phase 8 (Leiden community detection). Bundled plugins
      # only here so we don't depend on graphdatascience.ninja for Phase 0.
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "2g"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ancient-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: ancient-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-AncientChina}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-AncientChina}"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: ancient-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ancientadmin
      POSTGRES_PASSWORD: AncientChina
      POSTGRES_DB: ancient_auth
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ancientadmin -d ancient_auth"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ancient-app
    env_file:
      - .env
    environment:
      NEO4J_URI: bolt://neo4j:7687
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      DATABASE_URL: postgresql+asyncpg://ancientadmin:AncientChina@postgres:5432/ancient_auth
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    restart: unless-stopped

volumes:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  redis_data:
  minio_data:
  postgres_data:
