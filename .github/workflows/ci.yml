name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # PaddleOCR / PaddlePaddle are large GPU packages — skip in CI.
        # All tests mock OCR engines, so the packages are not needed at runtime.
        run: |
          uv sync --group dev \
            --no-install-package paddlepaddle \
            --no-install-package paddleocr

      - name: Run tests
        env:
          # Dummy env so modules that call os.getenv() don't crash on import
          LLM_API_KEY: "ci-dummy"
          LLM_BASE_URL: "https://api.silra.cn/v1/"
          CHAT_LLM_MODEL: "deepseek-chat"
          EMBED_LLM_MODEL: "text-embedding-v4"
          NEO4J_URI: "bolt://localhost:7687"
          NEO4J_USERNAME: "neo4j"
          NEO4J_PASSWORD: "AncientChina"
        run: uv run pytest -q --tb=short --ignore=apps/backend/tests/pipeline/test_translate.py

      - name: Run translation tests (no heavy deps)
        env:
          LLM_API_KEY: "ci-dummy"
          LLM_BASE_URL: "https://api.silra.cn/v1/"
          CHAT_LLM_MODEL: "deepseek-chat"
          EMBED_LLM_MODEL: "text-embedding-v4"
          NEO4J_URI: "bolt://localhost:7687"
          NEO4J_USERNAME: "neo4j"
          NEO4J_PASSWORD: "AncientChina"
        run: uv run pytest -q --tb=short apps/backend/tests/pipeline/test_translate.py
