# 紀年 → CE converter seed.
# Source: standard reign-period (年號) + sexagenary (干支) tables.
# Coverage: full 唐 (618-907) since corpus is Tang; selected eras for 隋/五代/
# 北宋 (so secondary citations resolve). Expand later via Phase 11.
#
# Notes on usage:
#   apps/backend/normalize/era.py converts strings like "貞觀十九年" or
#   "武德元年" or "貞觀乙巳" into a CE year. For 干支 inside a known era,
#   the converter walks the sexagenary cycle.
#   `era_name + N年` -> start_year + N - 1.
#   `元年` is N=1.
#
# 干支 (sexagenary) cycle reference, in order. The 60-year cycle anchors at
# 甲子 = year 4 BC of CE (or, equivalently, AD 4 = 甲子 in the +60n cycle
# convention used by 中國天文年曆).

ganzhi_cycle:
  - 甲子
  - 乙丑
  - 丙寅
  - 丁卯
  - 戊辰
  - 己巳
